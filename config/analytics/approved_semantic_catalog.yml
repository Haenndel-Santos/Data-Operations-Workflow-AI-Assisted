- id: order_lines
  source_table: order_details
  name: Order Lines
  description: One row per order and product pair. This is the transactional line
    grain; quantity, captured unit price, and discount belong to this grain.
  synonyms:
  - order details
  - sales order lines
  - itens de pedido
  - linhas de pedido
- id: orders
  source_table: orders
  name: Orders
  description: One row per commercial order, keyed by order_id. Freight and shipping
    fields belong to the order grain and must not be multiplied by line joins.
  synonyms:
