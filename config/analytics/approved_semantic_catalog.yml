dataset:
  id: northwind_commerce
  name: Northwind Commerce
  description: Commercial reference data for customers, orders, order lines, products,
    suppliers, employees, shipping, and sales territories. The version-1 catalog exposes
    only direct column aggregates; it does not define revenue or other calculated
    measures.
  synonyms:
  - northwind
  - northwind commercial operations
  - comercio northwind
  - operacoes comerciais northwind
tables:
- id: product_categories
  source_table: categories
  name: Product Categories
  description: One row per product category, keyed by category_id.
  synonyms:
  - category master
  - categorias de produto
- id: customer_demographic_assignments
  source_table: customer_customer_demo
  name: Customer Demographic Assignments
  description: One row per customer and demographic-type assignment. The benchmark
    table is structurally valid but contains no rows in this Northwind snapshot.
  synonyms:
