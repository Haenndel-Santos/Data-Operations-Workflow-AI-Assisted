version: 1
dataset:
  id: northwind_commerce
  name: Northwind Commerce
  description: >-
    Commercial reference data for customers, orders, order lines, products,
    suppliers, employees, shipping, and sales territories. The version-1
    catalog exposes only direct column aggregates; it does not define revenue
    or other calculated measures.
  synonyms:
  - northwind
  - northwind commercial operations
  - comercio northwind
  - operacoes comerciais northwind

tables:
- id: product_categories
  source_table: categories
  name: Product Categories
  description: One row per product category, keyed by category_id.
  synonyms:
  - category master
  - categorias de produto
- id: customer_demographic_assignments
  source_table: customer_customer_demo
  name: Customer Demographic Assignments
  description: >-
    One row per customer and demographic-type assignment. The benchmark table
    is structurally valid but contains no rows in this Northwind snapshot.
  synonyms:
  - customer type assignments
  - classificacoes demograficas de clientes
- id: customer_demographic_types
  source_table: customer_demographics
  name: Customer Demographic Types
  description: >-
    One row per customer demographic type. The benchmark table is structurally
    valid but contains no rows in this Northwind snapshot.
  synonyms:
  - customer types
  - tipos demograficos de clientes
- id: customers
  source_table: customers
  name: Customers
  description: One row per customer account, keyed by customer_id.
  synonyms:
  - customer master
  - clientes
  - cadastro de clientes
- id: employee_territory_assignments
  source_table: employee_territories
  name: Employee Territory Assignments
  description: One row per employee and territory assignment.
  synonyms:
  - territory staffing
  - atribuicoes territoriais de funcionarios
- id: employees
  source_table: employees
  name: Employees
  description: >-
    One row per employee, keyed by employee_id. reports_to stores the immediate
    manager employee ID when one exists.
  synonyms:
  - employee master
  - funcionarios
  - colaboradores
- id: order_lines
  source_table: order_details
  name: Order Lines
  description: >-
    One row per order and product pair. This is the transactional line grain;
    quantity, captured unit price, and discount belong to this grain.
  synonyms:
  - order details
  - sales order lines
  - itens de pedido
  - linhas de pedido
- id: orders
  source_table: orders
  name: Orders
  description: >-
    One row per commercial order, keyed by order_id. Freight and shipping
    fields belong to the order grain and must not be multiplied by line joins.
  synonyms:
  - sales orders
  - pedidos
  - pedidos de venda
- id: products
  source_table: products
  name: Products
  description: One row per product, keyed by product_id.
  synonyms:
  - product master
  - produtos
  - cadastro de produtos
- id: sales_regions
  source_table: region
  name: Sales Regions
  description: One row per sales region, keyed by region_id.
  synonyms:
  - geographic regions
  - regioes comerciais
- id: shippers
  source_table: shippers
  name: Shippers
  description: One row per shipping company, keyed by shipper_id.
  synonyms:
  - carriers
  - transportadoras
- id: suppliers
  source_table: suppliers
  name: Suppliers
  description: One row per supplier, keyed by supplier_id.
  synonyms:
  - supplier master
  - fornecedores
  - cadastro de fornecedores
- id: sales_territories
  source_table: territories
  name: Sales Territories
  description: One row per sales territory, keyed by territory_id.
  synonyms:
  - territories
  - territorios comerciais

