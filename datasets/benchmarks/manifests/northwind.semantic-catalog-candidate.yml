measures:
- id: category_count
  table_id: product_categories
  source_column: category_id
  function: count_distinct
  name: Category Count
  description: Distinct count of product-category identifiers.
  synonyms: [number of categories, quantidade de categorias]
- id: customer_count
  table_id: customers
  source_column: customer_id
  function: count_distinct
  name: Customer Count
  description: Distinct count of customer identifiers.
  synonyms: [number of customers, quantidade de clientes]
- id: employee_territory_assignment_count
  table_id: employee_territory_assignments
  source_column: "*"
  function: count
  name: Employee Territory Assignment Count
  description: Count of rows at the employee-and-territory assignment grain.
  synonyms: [territory assignment count, quantidade de atribuicoes territoriais]
- id: employee_count
  table_id: employees
  source_column: employee_id
  function: count_distinct
  name: Employee Count
  description: Distinct count of employee identifiers.
  synonyms: [number of employees, quantidade de funcionarios]
- id: order_line_count
  table_id: order_lines
  source_column: "*"
  function: count
  name: Order Line Count
  description: Count of rows at the order-and-product line grain.
  synonyms: [line count, quantidade de linhas de pedido]
- id: units_ordered_total
  table_id: order_lines
  source_column: quantity
  function: sum
  name: Total Units Ordered
  description: Sum of order-line quantity; additive at the order-line grain.
  synonyms: [ordered quantity, quantidade total pedida]
- id: line_unit_price_average
  table_id: order_lines
  source_column: unit_price
  function: avg
  name: Average Captured Line Unit Price
  description: Unweighted average of captured pre-discount unit price across order lines.
  synonyms: [average selling unit price, preco unitario medio da linha]
- id: line_discount_rate_average
  table_id: order_lines
  source_column: discount
  function: avg
  name: Average Line Discount Rate
  description: Unweighted average of the fractional discount across order lines.
  synonyms: [average discount, desconto medio da linha]
- id: order_count
  table_id: orders
  source_column: order_id
  function: count_distinct
  name: Order Count
  description: Distinct count of commercial order identifiers.
  synonyms: [number of orders, quantidade de pedidos]
- id: freight_total
  table_id: orders
  source_column: freight
  function: sum
  name: Total Order Freight
  description: >-
    Sum of freight at the order grain. It must not be aggregated after a
    one-to-many expansion from orders to order lines.
  synonyms: [total freight, frete total]
- id: freight_average
  table_id: orders
  source_column: freight
  function: avg
  name: Average Order Freight
  description: Unweighted average freight amount across orders.
  synonyms: [average freight, frete medio]
- id: product_count
  table_id: products
  source_column: product_id
  function: count_distinct
  name: Product Count
  description: Distinct count of product identifiers.
  synonyms: [number of products, quantidade de produtos]
- id: stock_units_total
  table_id: products
  source_column: units_in_stock
  function: sum
  name: Total Units In Stock
  description: >-
    Sum of the current units_in_stock snapshot across products; it is not an
    inventory movement or a time-additive measure.
  synonyms: [inventory units, unidades totais em estoque]
- id: units_on_order_total
  table_id: products
  source_column: units_on_order
  function: sum
  name: Total Units On Order
  description: Sum of the current units_on_order snapshot across products.
  synonyms: [open purchase units, unidades totais encomendadas]
- id: product_unit_price_average
  table_id: products
  source_column: unit_price
  function: avg
  name: Average Product List Unit Price
  description: Unweighted average of the current product catalog unit price.
  synonyms: [average list price, preco medio de tabela]
- id: sales_region_count
  table_id: sales_regions
  source_column: region_id
  function: count_distinct
  name: Sales Region Count
  description: Distinct count of sales-region identifiers.
  synonyms: [number of sales regions, quantidade de regioes comerciais]
- id: shipper_count
  table_id: shippers
  source_column: shipper_id
  function: count_distinct
  name: Shipper Count
  description: Distinct count of shipping-company identifiers.
  synonyms: [carrier count, quantidade de transportadoras]
- id: supplier_count
  table_id: suppliers
  source_column: supplier_id
  function: count_distinct
  name: Supplier Count
  description: Distinct count of supplier identifiers.
  synonyms: [number of suppliers, quantidade de fornecedores]
- id: sales_territory_count
  table_id: sales_territories
  source_column: territory_id
  function: count_distinct
  name: Sales Territory Count
  description: Distinct count of sales-territory identifiers.
  synonyms: [number of territories, quantidade de territorios comerciais]

relationship_paths:
- id: demographic_assignments_to_customers
  name: Demographic Assignments To Customers
  description: >-
    Many-to-one path from customer demographic assignments to customer
    accounts. A left join preserves assignment rows if future snapshots contain
    an unmatched customer.
  synonyms: [customer for demographic assignment]
  hops:
  - source_table_id: customer_demographic_assignments
    source_column: customer_id
    target_table_id: customers
    target_column: customer_id
    kind: left
- id: demographic_assignments_to_types
  name: Demographic Assignments To Types
  description: >-
    Many-to-one path from customer demographic assignments to demographic
    types. A left join preserves assignment rows if future snapshots contain an
    unmatched type.
  synonyms: [demographic type for assignment]
  hops:
  - source_table_id: customer_demographic_assignments
    source_column: customer_type_id
    target_table_id: customer_demographic_types
    target_column: customer_type_id
    kind: left
- id: employee_assignments_to_employees
  name: Employee Territory Assignments To Employees
  description: Many-to-one path from territory assignments to employees.
  synonyms: [employee for territory assignment]
  hops:
  - source_table_id: employee_territory_assignments
    source_column: employee_id
    target_table_id: employees
    target_column: employee_id
    kind: inner
- id: employee_assignments_to_territories
  name: Employee Territory Assignments To Territories
  description: Many-to-one path from employee-territory assignments to territories.
  synonyms: [territory for employee assignment]
  hops:
  - source_table_id: employee_territory_assignments
    source_column: territory_id
    target_table_id: sales_territories
    target_column: territory_id
    kind: inner
- id: employee_assignments_to_regions
  name: Employee Territory Assignments To Sales Regions
  description: >-
    Many-to-one two-hop path from employee-territory assignments through
    territories to sales regions; it preserves the assignment grain.
  synonyms: [sales region for employee assignment]
  hops:
  - source_table_id: employee_territory_assignments
    source_column: territory_id
    target_table_id: sales_territories
    target_column: territory_id
    kind: inner
  - source_table_id: sales_territories
    source_column: region_id
    target_table_id: sales_regions
    target_column: region_id
    kind: inner
- id: order_lines_to_orders
  name: Order Lines To Orders
  description: Many-to-one path from order lines to their parent orders.
  synonyms: [order for order line, relacao linha pedido]
  hops:
  - source_table_id: order_lines
    source_column: order_id
    target_table_id: orders
    target_column: order_id
    kind: inner
- id: order_lines_to_products
  name: Order Lines To Products
  description: Many-to-one path from order lines to products.
  synonyms: [product for order line, produto da linha de pedido]
  hops:
  - source_table_id: order_lines
    source_column: product_id
    target_table_id: products
    target_column: product_id
    kind: inner
- id: orders_to_customers
  name: Orders To Customers
  description: Many-to-one path from orders to customer accounts.
  synonyms: [customer for order, relacao pedido cliente]
  hops:
  - source_table_id: orders
    source_column: customer_id
    target_table_id: customers
    target_column: customer_id
    kind: inner
- id: orders_to_employees
  name: Orders To Employees
  description: Many-to-one path from orders to responsible employees.
  synonyms: [employee for order, funcionario responsavel pelo pedido]
  hops:
  - source_table_id: orders
    source_column: employee_id
    target_table_id: employees
    target_column: employee_id
    kind: inner
- id: orders_to_shippers
  name: Orders To Shippers
  description: Many-to-one path from orders to selected shipping companies.
  synonyms: [shipper for order, relacao pedido transportadora]
  hops:
  - source_table_id: orders
    source_column: ship_via
    target_table_id: shippers
    target_column: shipper_id
    kind: inner
- id: products_to_categories
  name: Products To Categories
  description: Many-to-one path from products to product categories.
  synonyms: [category for product, relacao produto categoria]
  hops:
  - source_table_id: products
    source_column: category_id
    target_table_id: product_categories
    target_column: category_id
    kind: inner
- id: products_to_suppliers
  name: Products To Suppliers
  description: Many-to-one path from products to suppliers.
