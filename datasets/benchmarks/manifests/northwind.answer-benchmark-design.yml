      operator: gte
      value: '1997-01-01'
    - term: order_date
      operator: lt
      value: '1998-01-01'
    order_by: []
    limit: 20
  result_shape: single_row
  expected_columns:
  - name: order_count
    type: integer
  comparison:
    mode: exact
    tolerances: []
