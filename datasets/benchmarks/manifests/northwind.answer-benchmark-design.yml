  question: How many orders are in the Northwind dataset?
  provider_response:
    version: 1
    from: orders
    relationship_paths: []
    dimensions: []
    metrics:
    - term: order_count
      alias: order_count
    filters: []
    order_by: []
    limit: 20
  result_shape: single_row
  expected_columns:
  - name: order_count
    type: integer
  comparison:
    mode: exact
    tolerances: []
