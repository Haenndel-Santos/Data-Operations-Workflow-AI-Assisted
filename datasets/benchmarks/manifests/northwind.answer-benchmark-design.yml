- id: orders_placed_in_1997
  coverage: [table_selection, measure_selection, filter_selection, exact_answer]
  question: How many orders were placed during calendar year 1997?
  provider_response:
    version: 1
    from: orders
    relationship_paths: []
    dimensions: []
    metrics:
    - term: order_count
      alias: order_count
    filters:
